name: Build MSYS2 Windows Archives

on:
  push:
    branches: [ stable, dev, all_msys2 ]
  pull_request:
    branches: [ stable, dev ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-simulator-windows-msys2:
    name: Build Simulator (${{ matrix.label }})
    runs-on: windows-latest
    timeout-minutes: 90
    defaults:
      run:
        shell: msys2 {0}
    env:
      WINDOWS_CERT_DATA: ${{ secrets.WINDOWS_CERT_DATA }}

    strategy:
      fail-fast: false
      matrix:
        include:
        - label: MSYS2 MINGW64 GCC
          msystem: MINGW64
          tool_root: /mingw64
          artifact_name: db48x-simulator-windows-mingw64
          package_dir: dist/msys2/mingw64
          qmake_specs: win32-g++
          qmake_args: ''
          packages: >-
            git
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-make
            mingw-w64-x86_64-freetype
            mingw-w64-x86_64-pkg-config
            mingw-w64-x86_64-libsystre
            mingw-w64-x86_64-qt6-base
            mingw-w64-x86_64-qt6-declarative
            mingw-w64-x86_64-qt6-multimedia
            mingw-w64-x86_64-qt6-translations
            mingw-w64-x86_64-qt6-tools
        - label: MSYS2 UCRT64 GCC
          msystem: UCRT64
          tool_root: /ucrt64
          artifact_name: db48x-simulator-windows-ucrt64
          package_dir: dist/msys2/ucrt64
          qmake_specs: win32-g++
          qmake_args: ''
          packages: >-
            git
            mingw-w64-ucrt-x86_64-freetype
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-libsystre
            mingw-w64-ucrt-x86_64-make
            mingw-w64-ucrt-x86_64-pkgconf
            mingw-w64-ucrt-x86_64-qt6-base
            mingw-w64-ucrt-x86_64-qt6-declarative
            mingw-w64-ucrt-x86_64-qt6-multimedia
            mingw-w64-ucrt-x86_64-qt6-translations
            mingw-w64-ucrt-x86_64-qt6-tools
        - label: MSYS2 CLANG64
          msystem: CLANG64
          tool_root: /clang64
          artifact_name: db48x-simulator-windows-clang64
          package_dir: dist/msys2/clang64
          qmake_specs: win32-clang-g++
          qmake_args: QMAKE_CC=clang QMAKE_CXX=clang++ QMAKE_LINK=clang++ QMAKE_LFLAGS+=-fuse-ld=lld
          packages: >-
            git
            mingw-w64-clang-x86_64-clang
            mingw-w64-clang-x86_64-compiler-rt
            mingw-w64-clang-x86_64-freetype
            mingw-w64-clang-x86_64-libsystre
            mingw-w64-clang-x86_64-lld
            mingw-w64-clang-x86_64-make
            mingw-w64-clang-x86_64-pkgconf
            mingw-w64-clang-x86_64-qt6-base
            mingw-w64-clang-x86_64-qt6-declarative
            mingw-w64-clang-x86_64-qt6-multimedia
            mingw-w64-clang-x86_64-qt6-translations
            mingw-w64-clang-x86_64-qt6-tools

    steps:
    - name: Use LF checkouts for MSYS2
      shell: pwsh
      run: git config --global core.autocrlf input

    - name: Checkout code
      uses: actions/checkout@v6
      with:
        persist-credentials: false
        submodules: recursive

    - name: Setup ${{ matrix.msystem }} toolchain
      uses: msys2/setup-msys2@v2
      with:
        msystem: ${{ matrix.msystem }}
        update: true
        cache: true
        install: ${{ matrix.packages }}

    - name: Show toolchain versions
      run: |
        uname -a
        gcc --version || true
        g++ --version || true
        clang --version || true
        ld.lld --version || true
        mingw32-make --version
        qmake6 --version || qmake --version

    - name: Build debug simulator
      env:
        QMAKE_SPECS: ${{ matrix.qmake_specs }}
        QMAKE_ARGS: ${{ matrix.qmake_args }}
      run: |
        echo "${{ github.run_number }}" > .build_id
        build_jobs="$(nproc 2>/dev/null || getconf _NPROCESSORS_ONLN 2>/dev/null || echo 2)"
        printf 'Using %s build jobs\n' "$build_jobs"

        if [[ -n "$QMAKE_ARGS" ]]; then
          mingw32-make -j"$build_jobs" debug-sim \
            QMAKE_SPECS="$QMAKE_SPECS" \
            QMAKE_ARGS="$QMAKE_ARGS"
        else
          mingw32-make -j"$build_jobs" debug-sim \
            QMAKE_SPECS="$QMAKE_SPECS"
        fi

        test -f db48x.exe
        ls -l db48x.exe

    - name: Create deploy bundle
      env:
        BUILD_LABEL: ${{ matrix.label }}
        PACKAGE_DIR: ${{ matrix.package_dir }}
        TOOL_ROOT: ${{ matrix.tool_root }}
      run: |
        package_dir="$PWD/$PACKAGE_DIR"
        rm -rf "$package_dir"
        mkdir -p "$package_dir"

        cp db48x.exe "$package_dir/"
        cp -r help "$package_dir/"
        windeployqt6 --force --compiler-runtime "$package_dir/db48x.exe"

        copy_msys2_deps()
        {
          local binary="$1"

          ldd "$binary" | awk '/=>/ { print $3 }' | sort -u | while IFS= read -r dep; do
            [[ -n "$dep" ]] || continue
            dep="$(cygpath -u "$dep" 2>/dev/null || printf '%s' "$dep")"

            case "$dep" in
              "$TOOL_ROOT"/bin/*.dll)
                cp -n "$dep" "$package_dir/"
                ;;
            esac
          done
        }

        copy_msys2_deps "$package_dir/db48x.exe"

        while IFS= read -r -d '' dll; do
          copy_msys2_deps "$dll"
        done < <(find "$package_dir" -type f -name '*.dll' -print0)

        {
          printf 'workflow=%s\n' "$GITHUB_WORKFLOW"
          printf 'ref=%s\n' "$GITHUB_REF"
          printf 'sha=%s\n' "$GITHUB_SHA"
          printf 'msystem=%s\n' "$MSYSTEM"
          printf 'tool_root=%s\n' "$TOOL_ROOT"
          printf 'label=%s\n' "$BUILD_LABEL"
          printf 'qmake_specs=%s\n' '${{ matrix.qmake_specs }}'
          printf 'qmake_args=%s\n' '${{ matrix.qmake_args }}'
          printf '\n[toolchain]\n'
          gcc --version 2>/dev/null | sed -n '1p' || true
          clang --version 2>/dev/null | sed -n '1p' || true
          qmake6 --version 2>/dev/null || qmake --version 2>/dev/null || true
        } > "$package_dir/BUILD-INFO.txt"

        find "$package_dir" -maxdepth 3 -type f | sort

    - name: Code sign Windows executable
      if: ${{ env.WINDOWS_CERT_DATA != '' }}
      uses: lando/code-sign-action@v3
      with:
        file: ${{ matrix.package_dir }}/db48x.exe
        certificate-data: ${{ secrets.WINDOWS_CERT_DATA }}
        certificate-password: ${{ secrets.WINDOWS_CERT_PASSWORD }}

    - name: Upload bundle artifact
      uses: actions/upload-artifact@v7
      with:
        name: ${{ matrix.artifact_name }}
        if-no-files-found: error
        path: ${{ matrix.package_dir }}/