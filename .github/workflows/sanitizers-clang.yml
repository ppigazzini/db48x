name: Sanitizers Clang

on:
  push:
    branches: [ stable, dev ]
  pull_request:
    branches: [ stable, dev ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

env:
  LLVM_VERSION: '22'
  QT_VERSION: '6.11.0'
  QT_LINUX_ARCH: 'linux_gcc_64'
  QT_MAC_ARCH: 'clang_64'

jobs:
  analyze-simulator-asan-ubsan-macos:
    name: Analyze Simulator (macOS, Apple Clang ASan/UBSan)
    runs-on: macos-latest
    timeout-minutes: 90

    steps:
    - name: Checkout code
      uses: actions/checkout@v6
      with:
        persist-credentials: false
        submodules: recursive

    - name: Show Apple Clang toolchain
      run: |
        clang --version
        symbolizer="$(xcrun --find llvm-symbolizer 2>/dev/null || true)"
        if [[ -n "$symbolizer" ]]; then
          printf 'Using llvm-symbolizer: %s\n' "$symbolizer"
          echo "ASAN_SYMBOLIZER_PATH=$symbolizer" >> "$GITHUB_ENV"
        fi

    - name: Install Qt
      uses: jurplel/install-qt-action@v4
      with:
        version: ${{ env.QT_VERSION }}
        aqtversion: '==3.3.*'
        host: 'mac'
        target: 'desktop'
        arch: ${{ env.QT_MAC_ARCH }}
        modules: 'qtmultimedia'
        cache: 'true'
        cache-key-prefix: 'db48x-qt-mac-clang'

    - name: Build simulator with Apple Clang ASan and UBSan
      env:
        HOME: ${{ runner.temp }}/db48x-macos-sanitizers-home
      run: |
        mkdir -p "$HOME"
        echo "${{ github.run_number }}" > .build_id
        build_jobs="$(sysctl -n hw.ncpu 2>/dev/null || echo 3)"
        printf 'Using %s build jobs\n' "$build_jobs"
        qmake_args=(
          QMAKE_CC=clang
          QMAKE_CXX=clang++
          QMAKE_LINK=clang++
          QMAKE_CFLAGS+=-fsanitize=address,undefined
          QMAKE_CXXFLAGS+=-fsanitize=address,undefined
          QMAKE_CFLAGS_DEBUG+=-O1
          QMAKE_CFLAGS_DEBUG+=-fno-omit-frame-pointer
          QMAKE_CXXFLAGS_DEBUG+=-O1
          QMAKE_CXXFLAGS_DEBUG+=-fno-omit-frame-pointer
          QMAKE_CXXFLAGS_DEBUG+=-fno-optimize-sibling-calls
          QMAKE_LFLAGS+=-fsanitize=address,undefined
        )
        make -j"$build_jobs" debug-sim QMAKE_ARGS="${qmake_args[*]}"

        simulator_candidates=(
          "$PWD/sim/debug"
          "$PWD/db48x.app/Contents/MacOS/db48x"
          "$PWD/sim/debug.app/Contents/MacOS/debug"
        )
        simulator_bin=
        for candidate in "${simulator_candidates[@]}"; do
          if [[ -x "$candidate" ]]; then
            simulator_bin="$candidate"
            break
          fi
        done

        if [[ -z "$simulator_bin" ]]; then
          echo "No runnable simulator binary found after debug-sim build." >&2
          qmake_makefile="$PWD/sim/db48x-sim-debug.mak"
          if [[ -f "$qmake_makefile" ]]; then
            echo "Generated qmake Makefile diagnostics:"
            grep -E '^(TARGET|DESTDIR|OBJECTS_DIR|MOC_DIR|RCC_DIR|UI_DIR)[[:space:]]*=' "$qmake_makefile" || true
          fi
          ls -ld "$PWD" "$PWD/sim"
          ls -la "$PWD/sim"
          find "$PWD" -maxdepth 7 -type f -perm -111 \( -name debug -o -path '*/Contents/MacOS/*' \) -print | sort || true
          exit 1
        fi

        printf 'Selected simulator binary: %s\n' "$simulator_bin"
        ls -l "$simulator_bin"
        file "$simulator_bin" || true

        printf 'SIMULATOR_BIN=%s\n' "$simulator_bin" >> "$GITHUB_ENV"

    - name: Exercise simulator under Apple Clang ASan/UBSan
      env:
        HOME: ${{ runner.temp }}/db48x-macos-sanitizers-home
        QT_QPA_PLATFORM: offscreen
        ASAN_OPTIONS: halt_on_error=1
        UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
        MallocNanoZone: '0'
      run: |
        simulator_bin="${SIMULATOR_BIN:-$PWD/sim/debug}"
        printf 'Using simulator binary: %s\n' "$simulator_bin"
        test -x "$simulator_bin"
        ls -l "$simulator_bin"
        "$simulator_bin" -Tall

  analyze-simulator-asan-ubsan-windows:
    name: Analyze Simulator (Windows, MSYS2 CLANG64 ASan/UBSan)
    runs-on: windows-latest
    timeout-minutes: 90

    steps:
    - name: Checkout code
      uses: actions/checkout@v6
      with:
        persist-credentials: false
        submodules: recursive

    - name: Setup MSYS2 CLANG64 toolchain
      uses: msys2/setup-msys2@v2
      with:
        msystem: CLANG64
        update: true
        cache: true
        install: >-
          git
          mingw-w64-clang-x86_64-clang
          mingw-w64-clang-x86_64-compiler-rt
          mingw-w64-clang-x86_64-freetype
          mingw-w64-clang-x86_64-libsystre
          mingw-w64-clang-x86_64-lld
          mingw-w64-clang-x86_64-make
          mingw-w64-clang-x86_64-pkgconf
          mingw-w64-clang-x86_64-qt6-base
          mingw-w64-clang-x86_64-qt6-declarative
          mingw-w64-clang-x86_64-qt6-multimedia
          mingw-w64-clang-x86_64-qt6-translations
          mingw-w64-clang-x86_64-qt6-tools

    - name: Show MSYS2 Clang toolchain
      shell: msys2 {0}
      run: |
        clang --version
        ld.lld --version
        llvm-symbolizer --version
        qmake6 --version || qmake --version

    - name: Build simulator with MSYS2 Clang ASan and UBSan
      shell: msys2 {0}
      env:
        HOME: ${{ runner.temp }}/db48x-windows-clang-sanitizers-home
      run: |
        mkdir -p "$HOME"
        export QMAKE_SPECS=win32-clang-g++
        echo "${{ github.run_number }}" > .build_id
        build_jobs="$(nproc 2>/dev/null || getconf _NPROCESSORS_ONLN 2>/dev/null || echo 2)"
        printf 'Using %s build jobs\n' "$build_jobs"
        qmake_args=(
          QMAKE_CC=clang
          QMAKE_CXX=clang++
          QMAKE_LINK=clang++
          QMAKE_CFLAGS+=-fsanitize=address,undefined
          QMAKE_CXXFLAGS+=-fsanitize=address,undefined
          QMAKE_CFLAGS_DEBUG+=-O1
          QMAKE_CFLAGS_DEBUG+=-fno-omit-frame-pointer
          QMAKE_CXXFLAGS_DEBUG+=-O1
          QMAKE_CXXFLAGS_DEBUG+=-fno-omit-frame-pointer
          QMAKE_CXXFLAGS_DEBUG+=-fno-optimize-sibling-calls
          QMAKE_LFLAGS+=-fsanitize=address,undefined
          QMAKE_LFLAGS+=-fuse-ld=lld
        )
        mingw32-make -j"$build_jobs" debug-sim \
          QMAKE_SPECS="$QMAKE_SPECS" \
          QMAKE_ARGS="${qmake_args[*]}"

        simulator_bin="$PWD/db48x.exe"
        if [[ ! -f "$simulator_bin" ]]; then
          echo "No runnable simulator binary found after debug-sim build." >&2
          ls -ld "$PWD" "$PWD/sim"
          ls -la "$PWD"
          ls -la "$PWD/sim"
          find "$PWD" -maxdepth 4 -type f \( -name 'db48x.exe' -o -name 'debug.exe' \) -print | sort || true
          exit 1
        fi

        printf 'Selected simulator binary: %s\n' "$simulator_bin"
        ls -l "$simulator_bin"
        file "$simulator_bin" || true

        printf 'SIMULATOR_BIN=%s\n' "$simulator_bin" >> "$GITHUB_ENV"

    - name: Exercise simulator under MSYS2 CLANG64 ASan/UBSan
      shell: msys2 {0}
      env:
        HOME: ${{ runner.temp }}/db48x-windows-clang-sanitizers-home
        QT_QPA_PLATFORM: offscreen
        ASAN_OPTIONS: halt_on_error=1
        UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
      run: |
        export QT_PLUGIN_PATH=/clang64/share/qt6/plugins
        export ASAN_SYMBOLIZER_PATH="${ASAN_SYMBOLIZER_PATH:-$(command -v llvm-symbolizer)}"
        simulator_bin="${SIMULATOR_BIN:-$PWD/db48x.exe}"
        printf 'Using simulator binary: %s\n' "$simulator_bin"
        test -f "$simulator_bin"
        ls -l "$simulator_bin"
        "$simulator_bin" -Tall

  analyze-simulator-asan-ubsan-linux:
    name: Analyze Simulator (Linux, Clang 22 ASan/UBSan)
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
    - name: Checkout code
      uses: actions/checkout@v6
      with:
        persist-credentials: false
        submodules: recursive

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          ca-certificates \
          libxcb-cursor0 \
          libgl1-mesa-dev \
          libxkbcommon-x11-0 \
          libfreetype6-dev \
          pkg-config \
          wget

    - name: Install LLVM and Clang 22
      run: |
        sudo bash -c "$(wget -O - https://apt.llvm.org/llvm.sh)" ./llvm.sh "${LLVM_VERSION}"
        sudo apt-get install -y --no-install-recommends \
          clang-"${LLVM_VERSION}" \
          clang-tools-"${LLVM_VERSION}" \
          clang-tidy-"${LLVM_VERSION}" \
          lld-"${LLVM_VERSION}" \
          libclang-rt-"${LLVM_VERSION}"-dev
        llvm_bindir="$(llvm-config-"${LLVM_VERSION}" --bindir)"
        echo "PATH=${llvm_bindir}:$PATH" >> "$GITHUB_ENV"
        echo "ASAN_SYMBOLIZER_PATH=${llvm_bindir}/llvm-symbolizer" >> "$GITHUB_ENV"

    - name: Show LLVM toolchain
      run: |
        clang --version
        clang-tidy --version
        ld.lld --version
        llvm-symbolizer --version
        command -v scan-build || command -v "scan-build-${LLVM_VERSION}" || true

    - name: Install Qt
      uses: jurplel/install-qt-action@v4
      with:
        version: ${{ env.QT_VERSION }}
        aqtversion: '==3.3.*'
        host: 'linux'
        target: 'desktop'
        arch: ${{ env.QT_LINUX_ARCH }}
        modules: 'qtmultimedia'
        cache: 'true'
        cache-key-prefix: 'db48x-qt-linux-clang'

    - name: Build simulator with Clang 22 ASan and UBSan
      env:
        HOME: ${{ runner.temp }}/db48x-clang-sanitizers-home
      run: |
        mkdir -p "$HOME"
        echo "${{ github.run_number }}" > .build_id
        build_jobs="$(nproc 2>/dev/null || getconf _NPROCESSORS_ONLN 2>/dev/null || echo 2)"
        printf 'Using %s build jobs\n' "$build_jobs"
        qmake_args=(
          QMAKE_CC=clang
          QMAKE_CXX=clang++
          QMAKE_LINK=clang++
          QMAKE_CFLAGS+=-fsanitize=address,undefined
          QMAKE_CXXFLAGS+=-fsanitize=address,undefined
          QMAKE_CFLAGS_DEBUG+=-O1
          QMAKE_CFLAGS_DEBUG+=-fno-omit-frame-pointer
          QMAKE_CXXFLAGS_DEBUG+=-O1
          QMAKE_CXXFLAGS_DEBUG+=-fno-omit-frame-pointer
          QMAKE_CXXFLAGS_DEBUG+=-fno-optimize-sibling-calls
          QMAKE_LFLAGS+=-fsanitize=address,undefined
          QMAKE_LFLAGS+=-fuse-ld=lld
        )
        make -j"$build_jobs" debug-sim QMAKE_ARGS="${qmake_args[*]}"

        simulator_bin="$(realpath -m "$PWD/sim/debug")"
        printf 'Expected debug-sim binary: %s\n' "$simulator_bin"
        if [[ ! -x "$simulator_bin" ]]; then
          echo "No runnable simulator binary found after debug-sim build." >&2
          qmake_makefile="$PWD/sim/db48x-sim-debug.mak"
          if [[ -f "$qmake_makefile" ]]; then
            echo "Generated qmake Makefile diagnostics:"
            grep -E '^(TARGET|DESTDIR|OBJECTS_DIR|MOC_DIR|RCC_DIR|UI_DIR)[[:space:]]*=' "$qmake_makefile" || true
          fi
          ls -ld "$PWD" "$PWD/sim"
          ls -la "$PWD/sim"
          find "$PWD/.build" -maxdepth 8 -type f \( -name 'db48x*' -o -name 'db48x*.exe' -o -name 'debug' \) -print | sort || true
          exit 1
        fi

        printf 'Selected simulator binary: %s\n' "$simulator_bin"
        ls -l "$simulator_bin"
        file "$simulator_bin" || true

        printf 'SIMULATOR_BIN=%s\n' "$simulator_bin" >> "$GITHUB_ENV"

    - name: Exercise simulator under Clang 22 ASan/UBSan
      env:
        HOME: ${{ runner.temp }}/db48x-clang-sanitizers-home
        QT_QPA_PLATFORM: offscreen
        ASAN_OPTIONS: detect_leaks=1:check_initialization_order=1
        UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
      run: |
        simulator_bin="$(realpath -m "${SIMULATOR_BIN:-$PWD/sim/debug}")"
        printf 'Using simulator binary: %s\n' "$simulator_bin"
        test -x "$simulator_bin"
        ls -l "$simulator_bin"
        "$simulator_bin" -Tall

  analyze-simulator-valgrind-linux:
    name: Analyze Simulator (Linux, Clang 22 Valgrind)
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
    - name: Checkout code
      uses: actions/checkout@v6
      with:
        persist-credentials: false
        submodules: recursive

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          ca-certificates \
          libxcb-cursor0 \
          libgl1-mesa-dev \
          libxkbcommon-x11-0 \
          libfreetype6-dev \
          pkg-config \
          valgrind \
          wget

    - name: Install LLVM and Clang 22
      run: |
        sudo bash -c "$(wget -O - https://apt.llvm.org/llvm.sh)" ./llvm.sh "${LLVM_VERSION}"
        sudo apt-get install -y --no-install-recommends \
          clang-"${LLVM_VERSION}" \
          clang-tools-"${LLVM_VERSION}" \
          clang-tidy-"${LLVM_VERSION}" \
          lld-"${LLVM_VERSION}" \
          libclang-rt-"${LLVM_VERSION}"-dev
        llvm_bindir="$(llvm-config-"${LLVM_VERSION}" --bindir)"
        echo "PATH=${llvm_bindir}:$PATH" >> "$GITHUB_ENV"

    - name: Show LLVM toolchain
      run: |
        clang --version
        ld.lld --version

    - name: Install Qt
      uses: jurplel/install-qt-action@v4
      with:
        version: ${{ env.QT_VERSION }}
        aqtversion: '==3.3.*'
        host: 'linux'
        target: 'desktop'
        arch: ${{ env.QT_LINUX_ARCH }}
        modules: 'qtmultimedia'
        cache: 'true'
        cache-key-prefix: 'db48x-qt-linux-clang'

    - name: Build simulator for Valgrind with Clang 22
      env:
        HOME: ${{ runner.temp }}/db48x-clang-valgrind-home
      run: |
        mkdir -p "$HOME"
        echo "${{ github.run_number }}" > .build_id
        build_jobs="$(nproc 2>/dev/null || getconf _NPROCESSORS_ONLN 2>/dev/null || echo 2)"
        printf 'Using %s build jobs\n' "$build_jobs"
        qmake_args=(
          QMAKE_CC=clang
          QMAKE_CXX=clang++
          QMAKE_LINK=clang++
          QMAKE_LFLAGS+=-fuse-ld=lld
        )
        make -j"$build_jobs" debug-sim QMAKE_ARGS="${qmake_args[*]}"

        simulator_bin="$(realpath -m "$PWD/sim/debug")"
        printf 'Expected debug-sim binary: %s\n' "$simulator_bin"
        if [[ ! -x "$simulator_bin" ]]; then
          echo "No runnable simulator binary found after debug-sim build." >&2
          qmake_makefile="$PWD/sim/db48x-sim-debug.mak"
          if [[ -f "$qmake_makefile" ]]; then
            echo "Generated qmake Makefile diagnostics:"
            grep -E '^(TARGET|DESTDIR|OBJECTS_DIR|MOC_DIR|RCC_DIR|UI_DIR)[[:space:]]*=' "$qmake_makefile" || true
          fi
          ls -ld "$PWD" "$PWD/sim"
          ls -la "$PWD/sim"
          find "$PWD/.build" -maxdepth 8 -type f \( -name 'db48x*' -o -name 'db48x*.exe' -o -name 'debug' \) -print | sort || true
          exit 1
        fi

        printf 'Selected simulator binary: %s\n' "$simulator_bin"
        ls -l "$simulator_bin"
        file "$simulator_bin" || true

        printf 'SIMULATOR_BIN=%s\n' "$simulator_bin" >> "$GITHUB_ENV"

    - name: Exercise simulator under Clang 22 Valgrind
      env:
        HOME: ${{ runner.temp }}/db48x-clang-valgrind-home
        QT_QPA_PLATFORM: offscreen
        G_DEBUG: gc-friendly
        G_SLICE: always-malloc
      run: |
        simulator_bin="$(realpath -m "${SIMULATOR_BIN:-$PWD/sim/debug}")"
        printf 'Using simulator binary: %s\n' "$simulator_bin"
        test -x "$simulator_bin"
        ls -l "$simulator_bin"
        valgrind_args=(
          --tool=memcheck
          --leak-check=full
          --show-leak-kinds=definite,possible
          --errors-for-leak-kinds=definite,possible
          --track-origins=yes
          --num-callers=30
          --error-exitcode=1
        )
        valgrind "${valgrind_args[@]}" "$simulator_bin" -Tall

  analyze-simulator-static-linux:
    name: Analyze Simulator (Linux, Clang 22 scan-build)
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
    - name: Checkout code
      uses: actions/checkout@v6
      with:
        persist-credentials: false
        submodules: recursive

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          ca-certificates \
          libxcb-cursor0 \
          libgl1-mesa-dev \
          libxkbcommon-x11-0 \
          libfreetype6-dev \
          pkg-config \
          wget

    - name: Install LLVM and Clang 22
      run: |
        sudo bash -c "$(wget -O - https://apt.llvm.org/llvm.sh)" ./llvm.sh "${LLVM_VERSION}"
        sudo apt-get install -y --no-install-recommends \
          clang-"${LLVM_VERSION}" \
          clang-tools-"${LLVM_VERSION}" \
          clang-tidy-"${LLVM_VERSION}" \
          lld-"${LLVM_VERSION}" \
          libclang-rt-"${LLVM_VERSION}"-dev
        llvm_bindir="$(llvm-config-"${LLVM_VERSION}" --bindir)"
        echo "PATH=${llvm_bindir}:$PATH" >> "$GITHUB_ENV"

    - name: Show static-analysis toolchain
      run: |
        scan_build="$(command -v scan-build || true)"
        scan_build_py="$(command -v scan-build-py || true)"
        intercept_build="$(command -v intercept-build || true)"
        analyze_build="$(command -v analyze-build || true)"

        if [[ -z "$intercept_build" || -z "$analyze_build" ]]; then
          echo "Missing required scan-build-py tooling from LLVM ${LLVM_VERSION}." >&2
          llvm_bindir="$(llvm-config-"${LLVM_VERSION}" --bindir)"
          ls -1 "$llvm_bindir" | grep -E 'scan-build|intercept-build|analyze-build' || true
          exit 1
        fi

        if [[ -n "$scan_build" ]]; then
          printf 'Using scan-build: %s\n' "$scan_build"
        fi
        if [[ -n "$scan_build_py" ]]; then
          printf 'Using scan-build-py: %s\n' "$scan_build_py"
        fi
        printf 'Using intercept-build: %s\n' "$intercept_build"
        printf 'Using analyze-build: %s\n' "$analyze_build"

    - name: Install Qt
      uses: jurplel/install-qt-action@v4
      with:
        version: ${{ env.QT_VERSION }}
        aqtversion: '==3.3.*'
        host: 'linux'
        target: 'desktop'
        arch: ${{ env.QT_LINUX_ARCH }}
        modules: 'qtmultimedia'
        cache: 'true'
        cache-key-prefix: 'db48x-qt-linux-clang'

    - name: Build simulator under scan-build
      env:
        HOME: ${{ runner.temp }}/db48x-clang-scan-build-home
      run: |
        mkdir -p "$HOME"
        echo "${{ github.run_number }}" > .build_id
        build_jobs="$(nproc 2>/dev/null || getconf _NPROCESSORS_ONLN 2>/dev/null || echo 2)"
        report_dir="$PWD/.scan-build-reports"
        compile_db="$PWD/compile_commands.json"
        rm -rf "$report_dir"
        rm -f "$compile_db"
        mkdir -p "$report_dir"

        intercept_build="$(command -v intercept-build || true)"
        analyze_build="$(command -v analyze-build || true)"
        clang_bin="$(command -v clang || true)"
        clangxx_bin="$(command -v clang++ || true)"

        if [[ -z "$intercept_build" || -z "$analyze_build" || -z "$clang_bin" || -z "$clangxx_bin" ]]; then
          echo "Missing required static-analysis tooling from LLVM ${LLVM_VERSION}." >&2
          llvm_bindir="$(llvm-config-"${LLVM_VERSION}" --bindir)"
          ls -1 "$llvm_bindir" | grep -E 'scan-build|intercept-build|analyze-build|clang(\+\+)?$' || true
          exit 1
        fi

        printf 'Using %s build jobs\n' "$build_jobs"
        printf 'Using intercept-build: %s\n' "$intercept_build"
        printf 'Using analyze-build: %s\n' "$analyze_build"
        printf 'Using clang: %s\n' "$clang_bin"
        printf 'Using clang++: %s\n' "$clangxx_bin"

        qmake_args=(
          QMAKE_CC="$clang_bin"
          QMAKE_CXX="$clangxx_bin"
          QMAKE_LINK="$clangxx_bin"
          QMAKE_LFLAGS+=-fuse-ld=lld
        )

        "$intercept_build" \
          --cdb "$compile_db" \
          --use-cc="$clang_bin" \
          --use-c++="$clangxx_bin" \
          make -k -j"$build_jobs" debug-sim QMAKE_ARGS="${qmake_args[*]}"

        "$analyze_build" \
          --cdb "$compile_db" \
          --status-bugs \
          --keep-empty \
          --use-analyzer="$clang_bin" \
          -o "$report_dir"

    - name: Upload scan-build report
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: db48x-clang-scan-build-report
        path: .scan-build-reports
        if-no-files-found: ignore
        retention-days: 7